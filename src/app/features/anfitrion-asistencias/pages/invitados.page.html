@let ev = vm.evento()!;
<div
  class="bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.04)] border border-gray-100 p-6 mb-8"
>
  <app-guest-table
    [evento]="ev"
    [invitados]="vm.invitados()"
    [cargando]="vm.cargando()"
    [tieneInvitacion]="vm.tieneInvitacion()"
    [totalConfirmados]="vm.totalConfirmados()"
    [totalPendientesConfirmacion]="vm.totalPendientesConfirmacion()"
    [totalCancelados]="vm.totalCancelados()"
    (abrirDetalle)="vm.abrirModalDetalle($event)"
    (abrirEditar)="vm.abrirModalInvitado($event)"
    (crearInvitado)="vm.abrirModalInvitado()"
    (compartir)="vm.abrirModalCompartir()"
    (abrirQr)="vm.abrirModalQr($event)"
    (cambiarPases)="vm.cambiarPasesInvitado($event.invitado, $event.delta)"
    (enviarInvitacionWa)="vm.enviarInvitacionWhatsApp($event)"
    (enviarPaseWa)="vm.enviarPaseVipWhatsApp($event)"
  >
  </app-guest-table>
</div>
