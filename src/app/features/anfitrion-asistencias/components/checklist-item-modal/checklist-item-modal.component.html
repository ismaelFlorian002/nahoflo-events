<form [formGroup]="form" (ngSubmit)="guardar()" class="p-1 space-y-4">
  <!-- Fase & Título -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Etapa / Fase del Evento *</label>
      <p-dropdown
        [options]="fases"
        formControlName="fase"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Seleccionar Etapa">
      </p-dropdown>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Título de la Tarea *</label>
      <input
        type="text"
        pInputText
        formControlName="titulo"
        placeholder="Ej. Definir concepto y paleta de colores"
        class="w-full p-inputtext-sm"
      />
    </div>
  </div>

  <!-- Responsable & Prioridad -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Responsable Asignado</label>
      <p-dropdown
        [options]="responsables"
        formControlName="responsable"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Responsable">
      </p-dropdown>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nivel de Prioridad</label>
      <p-dropdown
        [options]="prioridades"
        formControlName="prioridad"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Prioridad">
      </p-dropdown>
    </div>
  </div>

  <!-- Fecha Límite & Notas -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Fecha Límite Sugerida</label>
      <input
        type="date"
        pInputText
        formControlName="fechaLimite"
        class="w-full p-inputtext-sm"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Notas / Instrucciones</label>
      <input
        type="text"
        pInputText
        formControlName="notas"
        placeholder="Ej. Revisar contrato de loza y mantelería"
        class="w-full p-inputtext-sm"
      />
    </div>
  </div>

  <!-- Botones de Acción -->
  <div class="flex justify-end items-center gap-2 pt-4 border-t border-slate-100">
    <p-button
      type="button"
      label="Cancelar"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancelar()">
    </p-button>
    <p-button
      type="submit"
      [label]="esEdicion ? 'Actualizar Tarea' : 'Guardar Tarea'"
      icon="pi pi-check"
      severity="primary">
    </p-button>
  </div>
</form>
