<form [formGroup]="form" (ngSubmit)="guardar()" class="grid grid-cols-12 gap-x-5 gap-y-7 pt-6">

  <!-- FILA 1: ETAPA / FASE (6 COLS) Y TÍTULO DE LA TAREA (6 COLS) -->
  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <p-dropdown
        id="fase"
        inputId="fase"
        [options]="fases"
        formControlName="fase"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Seleccionar Etapa">
      </p-dropdown>
      <label for="fase">Etapa / Fase del Evento *</label>
    </p-floatLabel>
  </div>

  <div class="col-span-12 sm:col-span-6 flex flex-col gap-1">
    <p-floatLabel class="w-full block">
      <input
        pInputText
        id="titulo"
        type="text"
        formControlName="titulo"
        class="w-full"
        autocomplete="off" />
      <label for="titulo">Título de la Tarea *</label>
    </p-floatLabel>
    @if (form.get('titulo')?.touched && form.get('titulo')?.invalid) {
      <span class="text-xs text-rose-500 font-semibold pl-1">El título es requerido (mínimo 3 caracteres).</span>
    }
  </div>

  <!-- FILA 2: RESPONSABLE (6 COLS) Y PRIORIDAD (6 COLS) -->
  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <p-dropdown
        id="responsable"
        inputId="responsable"
        [options]="responsables"
        formControlName="responsable"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Responsable">
      </p-dropdown>
      <label for="responsable">Responsable Asignado</label>
    </p-floatLabel>
  </div>

  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <p-dropdown
        id="prioridad"
        inputId="prioridad"
        [options]="prioridades"
        formControlName="prioridad"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Prioridad">
      </p-dropdown>
      <label for="prioridad">Nivel de Prioridad</label>
    </p-floatLabel>
  </div>

  <!-- FILA 3: FECHA LÍMITE (6 COLS) Y NOTAS (6 COLS) -->
  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <p-calendar
        id="fechaLimite"
        inputId="fechaLimite"
        formControlName="fechaLimite"
        [showIcon]="true"
        [iconDisplay]="'input'"
        dateFormat="dd/mm/yy"
        appendTo="body"
        styleClass="w-full"
        inputStyleClass="w-full">
      </p-calendar>
      <label for="fechaLimite">Fecha Límite Sugerida</label>
    </p-floatLabel>
  </div>

  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <input
        pInputText
        id="notas"
        type="text"
        formControlName="notas"
        class="w-full"
        autocomplete="off" />
      <label for="notas">Notas / Instrucciones</label>
    </p-floatLabel>
  </div>

  <!-- BOTONES DE ACCIÓN -->
  <div class="col-span-12 flex justify-end gap-3 pt-3 mt-2 border-t border-slate-100">
    <p-button
      type="button"
      label="Cancelar"
      severity="danger"
      [text]="true"
      size="small"
      (onClick)="cancelar()">
    </p-button>

    <p-button
      type="submit"
      [label]="esEdicion ? 'Actualizar Tarea' : 'Guardar Tarea'"
      [icon]="esEdicion ? 'pi pi-check' : 'pi pi-plus'"
      size="small">
    </p-button>
  </div>
</form>
