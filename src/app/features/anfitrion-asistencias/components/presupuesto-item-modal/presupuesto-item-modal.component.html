<form [formGroup]="form" (ngSubmit)="guardar()" class="p-1 space-y-4">
  <!-- Categoría & Concepto -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Categoría del Gasto *</label>
      <p-dropdown
        [options]="categorias"
        formControlName="categoria"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Seleccionar Categoría">
      </p-dropdown>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Concepto / Servicio *</label>
      <input
        type="text"
        pInputText
        formControlName="concepto"
        placeholder="Ej. Anticipo Banquete 150 Personas"
        class="w-full p-inputtext-sm"
      />
    </div>
  </div>

  <!-- Montos Financieros: Estimado, Real, Pagado -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Costo Estimado ($)</label>
      <p-inputNumber
        formControlName="costoEstimado"
        mode="currency"
        currency="MXN"
        locale="es-MX"
        styleClass="w-full"
        inputStyleClass="w-full text-sm font-medium"
        [min]="0">
      </p-inputNumber>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Costo Real Acordado ($)</label>
      <p-inputNumber
        formControlName="costoReal"
        mode="currency"
        currency="MXN"
        locale="es-MX"
        styleClass="w-full"
        inputStyleClass="w-full text-sm font-semibold text-slate-800"
        [min]="0">
      </p-inputNumber>
    </div>

    <div>
      <label class="block text-xs font-semibold text-emerald-700 mb-1">Monto Pagado ($)</label>
      <p-inputNumber
        formControlName="montoPagado"
        mode="currency"
        currency="MXN"
        locale="es-MX"
        styleClass="w-full"
        inputStyleClass="w-full text-sm font-bold text-emerald-600"
        [min]="0">
      </p-inputNumber>
    </div>
  </div>

  <!-- Estado de Pago & Proveedor -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Estatus del Pago *</label>
      <p-dropdown
        [options]="estadosPago"
        formControlName="estadoPago"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Estatus">
      </p-dropdown>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Proveedor / Empresa</label>
      <input
        type="text"
        pInputText
        formControlName="proveedorNombre"
        placeholder="Ej. Eventos Gourmet MX"
        class="w-full p-inputtext-sm"
      />
    </div>
  </div>

  <!-- Fecha Límite de Pago & Notas -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Fecha Límite de Pago</label>
      <input
        type="date"
        pInputText
        formControlName="fechaLimitePago"
        class="w-full p-inputtext-sm"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Notas / Detalles</label>
      <input
        type="text"
        pInputText
        formControlName="notas"
        placeholder="Ej. Incluye cristalería y meseros"
        class="w-full p-inputtext-sm"
      />
    </div>
  </div>

  <!-- Botones de Acción -->
  <div class="flex justify-end items-center gap-2 pt-4 border-t border-slate-100">
    <p-button
      type="button"
      size="small"
      label="Cancelar"
      text="true"
      icon="pi pi-times"
      severity="danger"
      (onClick)="cancelar()">
    </p-button>
    <p-button
      type="submit"
      [label]="esEdicion ? 'Actualizar Partida' : 'Guardar Partida'"
      icon="pi pi-check"
      size="small"
      severity="primary">
    </p-button>
  </div>
</form>
