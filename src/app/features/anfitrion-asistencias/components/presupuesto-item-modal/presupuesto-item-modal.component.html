<form [formGroup]="form" (ngSubmit)="guardar()" class="grid grid-cols-12 gap-x-5 gap-y-7 pt-6">

  <!-- FILA 1: CATEGORÍA (5 COLS) & CONCEPTO (7 COLS) -->
  <div class="col-span-12 sm:col-span-5">
    <p-floatLabel class="w-full block">
      <p-dropdown
        id="categoria"
        inputId="categoria"
        [options]="categorias"
        formControlName="categoria"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full">
      </p-dropdown>
      <label for="categoria">Categoría del Gasto *</label>
    </p-floatLabel>
  </div>

  <div class="col-span-12 sm:col-span-7">
    <p-floatLabel class="w-full block">
      <input
        type="text"
        id="concepto"
        pInputText
        formControlName="concepto"
        class="w-full"
        autocomplete="off"
      />
      <label for="concepto">Concepto / Servicio *</label>
    </p-floatLabel>
  </div>

  <!-- FILA 2: MONTOS FINANCIEROS (TARJETA EN 12 COLS CON 3 COLS INTERNAS) -->
  <div class="col-span-12 bg-slate-50/80 p-4 pt-6 rounded-2xl border border-slate-200">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-x-4 gap-y-6">
      <div>
        <p-floatLabel class="w-full block">
          <p-inputNumber
            id="costoEstimado"
            inputId="costoEstimado"
            formControlName="costoEstimado"
            mode="currency"
            currency="MXN"
            locale="es-MX"
            styleClass="w-full"
            inputStyleClass="w-full font-medium"
            [min]="0">
          </p-inputNumber>
          <label for="costoEstimado">Costo Estimado ($)</label>
        </p-floatLabel>
      </div>

      <div>
        <p-floatLabel class="w-full block">
          <p-inputNumber
            id="costoReal"
            inputId="costoReal"
            formControlName="costoReal"
            mode="currency"
            currency="MXN"
            locale="es-MX"
            styleClass="w-full"
            inputStyleClass="w-full font-semibold text-slate-800"
            [min]="0">
          </p-inputNumber>
          <label for="costoReal">Costo Real Acordado ($)</label>
        </p-floatLabel>
      </div>

      <div>
        <p-floatLabel class="w-full block">
          <p-inputNumber
            id="montoPagado"
            inputId="montoPagado"
            formControlName="montoPagado"
            mode="currency"
            currency="MXN"
            locale="es-MX"
            styleClass="w-full"
            inputStyleClass="w-full font-bold text-emerald-600"
            [min]="0">
          </p-inputNumber>
          <label for="montoPagado" class="text-emerald-700">Monto Pagado ($)</label>
        </p-floatLabel>
      </div>
    </div>
  </div>

  <!-- FILA 3: ESTADO DE PAGO (5 COLS) & PROVEEDOR (7 COLS) -->
  <div class="col-span-12 sm:col-span-5">
    <p-floatLabel class="w-full block">
      <p-dropdown
        id="estadoPago"
        inputId="estadoPago"
        [options]="estadosPago"
        formControlName="estadoPago"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full">
      </p-dropdown>
      <label for="estadoPago">Estatus del Pago *</label>
    </p-floatLabel>
  </div>

  <div class="col-span-12 sm:col-span-7">
    <p-floatLabel class="w-full block">
      <input
        type="text"
        id="proveedorNombre"
        pInputText
        formControlName="proveedorNombre"
        class="w-full"
        autocomplete="off"
      />
      <label for="proveedorNombre">Proveedor / Empresa</label>
    </p-floatLabel>
  </div>

  <!-- FILA 4: FECHA LÍMITE DE PAGO (5 COLS) & NOTAS (7 COLS) -->
  <div class="col-span-12 sm:col-span-5">
    <p-floatLabel class="w-full block">
      <p-calendar
        id="fechaLimitePago"
        inputId="fechaLimitePago"
        formControlName="fechaLimitePago"
        [showIcon]="true"
        [iconDisplay]="'input'"
        dateFormat="dd/mm/yy"
        appendTo="body"
        styleClass="w-full"
        inputStyleClass="w-full">
      </p-calendar>
      <label for="fechaLimitePago">Fecha Límite de Pago</label>
    </p-floatLabel>
  </div>

  <div class="col-span-12 sm:col-span-7">
    <p-floatLabel class="w-full block">
      <input
        type="text"
        id="notas"
        pInputText
        formControlName="notas"
        class="w-full"
        autocomplete="off"
      />
      <label for="notas">Notas / Detalles</label>
    </p-floatLabel>
  </div>

  <!-- BOTONES DE ACCIÓN (ALINEADOS A LA DERECHA) -->
  <div class="col-span-12 flex justify-end items-center gap-3 pt-3 mt-2 border-t border-slate-100">
    <p-button
      type="button"
      size="small"
      label="Cancelar"
      [text]="true"
      icon="pi pi-times"
      severity="secondary"
      (onClick)="cancelar()">
    </p-button>
    <p-button
      type="submit"
      [label]="esEdicion ? 'Actualizar Partida' : 'Guardar Partida'"
      icon="pi pi-check"
      size="small"
      severity="primary">
    </p-button>
  </div>

</form>
