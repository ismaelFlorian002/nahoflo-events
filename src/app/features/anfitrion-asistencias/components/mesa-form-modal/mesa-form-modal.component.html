<div class="w-full max-w-full overflow-x-hidden p-1">
  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-5">

    <!-- Nombre de la Mesa -->
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1.5 flex items-center gap-1.5">
        <i class="pi pi-tag text-gold-500"></i>
        Nombre de la Mesa <span class="text-rose-500">*</span>
      </label>
      <input
        pInputText
        type="text"
        formControlName="nombre"
        placeholder="ej. Mesa 1, Mesa VIP, Mesa Novios"
        class="w-full p-inputtext-sm rounded-xl border-gray-300 focus:border-gold-500 focus:ring-gold-500/20 py-2.5 px-3.5 text-gray-800 font-medium shadow-sm"
      />
      <small
        *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched"
        class="text-rose-500 text-xs mt-1 block font-semibold"
      >
        El nombre de la mesa es obligatorio.
      </small>
    </div>

    <!-- Forma de la Mesa & Capacidad -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1.5 flex items-center gap-1.5">
          <i class="pi pi-shapes text-gold-500"></i>
          Forma de la Mesa
        </label>
        <p-dropdown
          [options]="opcionesForma"
          formControlName="forma"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        ></p-dropdown>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1.5 flex items-center gap-1.5">
          <i class="pi pi-users text-gold-500"></i>
          Capacidad (Asientos) <span class="text-rose-500">*</span>
        </label>
        <p-inputNumber
          formControlName="capacidad"
          [min]="1"
          [max]="50"
          [showButtons]="true"
          buttonLayout="horizontal"
          spinnerMode="horizontal"
          decrementButtonClass="p-button-secondary p-button-outlined !rounded-l-xl"
          incrementButtonClass="p-button-secondary p-button-outlined !rounded-r-xl"
          incrementButtonIcon="pi pi-plus"
          decrementButtonIcon="pi pi-minus"
          styleClass="w-full p-inputtext-sm"
        ></p-inputNumber>
      </div>
    </div>

    <!-- Sugerencias rápidas de nombres -->
    <div class="bg-gold-50/60 p-3.5 rounded-2xl border border-gold-200/80">
      <span class="text-[11px] font-bold text-gold-800 uppercase tracking-wider block mb-2 flex items-center gap-1">
        <i class="pi pi-bolt text-gold-500"></i> Nombres Sugeridos Rápido:
      </span>
      <div class="flex flex-wrap gap-1.5">
        <button
          type="button"
          *ngFor="let sug of sugerencias"
          (click)="usarSugerencia(sug)"
          class="px-3 py-1 rounded-xl text-xs font-semibold bg-white text-gray-700 hover:bg-gold-500 hover:text-white transition-all shadow-sm border border-gold-200 cursor-pointer active:scale-95"
        >
          {{ sug }}
        </button>
      </div>
    </div>

    <!-- Notas / Ubicación -->
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1.5 flex items-center gap-1.5">
        <i class="pi pi-map-marker text-gold-500"></i>
        Notas / Ubicación (Opcional)
      </label>
      <input
        pInputText
        type="text"
        formControlName="notas"
        placeholder="ej. Junto a la pista de baile, Zona VIP"
        class="w-full p-inputtext-sm rounded-xl border-gray-300 focus:border-gold-500 focus:ring-gold-500/20 py-2.5 px-3.5 text-gray-800 shadow-sm"
      />
    </div>

    <!-- Acciones -->
    <div class="flex items-center justify-end gap-2 pt-4 border-t border-gray-100 mt-2">
      <p-button
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        size="small"
        [text]="true"
        severity="secondary"
        (onClick)="ref.close()"
      ></p-button>
      <p-button
        type="submit"
        [label]="esEdicion ? 'Guardar Cambios' : 'Crear Mesa'"
        [icon]="esEdicion ? 'pi pi-check' : 'pi pi-plus'"
        size="small"
        [disabled]="form.invalid"
        styleClass="bg-gold-500 hover:bg-gold-600 text-white border-0 shadow-sm font-semibold !rounded-xl"
      ></p-button>
    </div>
  </form>
</div>
