<form [formGroup]="form" (ngSubmit)="guardar()" class="grid grid-cols-12 gap-x-5 gap-y-7 pt-6">

  <!-- FILA 1: NOMBRE DE LA MESA (12 COLS) -->
  <div class="col-span-12 flex flex-col gap-1">
    <p-floatlabel variant="on" class="w-full block">
      <input
        pInputText
        id="nombre"
        type="text"
        formControlName="nombre"
        class="w-full"
        autocomplete="off" />
      <label for="nombre">Nombre de la Mesa * (ej. Mesa 1, Mesa VIP, Mesa Novios)</label>
    </p-floatlabel>
    @if (form.get('nombre')?.touched && form.get('nombre')?.invalid) {
      <span class="text-xs text-rose-500 font-semibold pl-1">El nombre de la mesa es obligatorio.</span>
    }
  </div>

  <!-- SUGERENCIAS RÁPIDAS DE NOMBRES (12 COLS) -->
  <div class="col-span-12 bg-purple-50/60 p-3.5 rounded-2xl border border-purple-100/80">
    <span class="text-[11px] font-bold text-purple-800 uppercase tracking-wider block mb-2 flex items-center gap-1">
      <i class="pi pi-bolt text-purple-600"></i> Nombres Sugeridos Rápido:
    </span>
    <div class="flex flex-wrap gap-1.5">
      @for (sug of sugerencias; track sug) {
        <button
          type="button"
          (click)="usarSugerencia(sug)"
          class="hover:text-white cursor-pointer">
          {{ sug }}
        </button>
      }
    </div>
  </div>

  <!-- FILA 2: FORMA DE LA MESA (6 COLS) Y CAPACIDAD (6 COLS) -->
  <div class="col-span-12 sm:col-span-6">
    <p-floatlabel variant="on" class="w-full block">
      <p-select
        id="forma"
        inputId="forma"
        [options]="opcionesForma"
        formControlName="forma"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Forma de la Mesa">
      </p-select>
      <label for="forma">Forma de la Mesa *</label>
    </p-floatlabel>
  </div>

  <div class="col-span-12 sm:col-span-6">
    <p-floatlabel variant="on" class="w-full block">
      <p-inputnumber
        id="capacidad"
        inputId="capacidad"
        formControlName="capacidad"
        [min]="1"
        [max]="50"
        styleClass="w-full"
        inputStyleClass="w-full font-semibold text-slate-800">
      </p-inputnumber>
      <label for="capacidad">Capacidad (Asientos) *</label>
    </p-floatlabel>
  </div>

  <!-- FILA 3: NOTAS / UBICACIÓN (12 COLS) -->
  <div class="col-span-12">
    <p-floatlabel variant="on" class="w-full block">
      <input
        pInputText
        id="notas"
        type="text"
        formControlName="notas"
        class="w-full"
        autocomplete="off" />
      <label for="notas">Notas / Ubicación (Opcional, ej. Junto a la pista de baile)</label>
    </p-floatlabel>
  </div>

  <!-- BOTONES DE ACCIÓN -->
  <div class="col-span-12 flex justify-end gap-3 pt-3 mt-2 border-t border-slate-100">
    <button pButton type="button"
     
      severity="danger"
      [text]="true"
      size="small"
      (click)="ref.close()">
  <span>Cancelar</span>
</button>

    <button pButton type="submit"
     
     
      size="small"
      [disabled]="form.invalid">
  <i [class]="esEdicion ? 'pi pi-check' : 'pi pi-plus'"></i>
  <span>{{ esEdicion ? 'Guardar Cambios' : 'Crear Mesa' }}</span>
 </button>
  </div>
</form>
