<form [formGroup]="form" (ngSubmit)="guardar()" class="p-1 space-y-4">
  <div class="bg-purple-50/70 p-3 rounded-xl border border-purple-100 flex items-center gap-3 text-xs text-purple-900 mb-2">
    <i class="pi pi-crown text-purple-600 text-lg shrink-0"></i>
    <span>
      Configura la firma de tu <strong>Agencia / Wedding Planner Studio</strong> para aparecer como marca blanca en el portal del evento y reportes PDF.
    </span>
  </div>

  <!-- Nombre Comercial & Teléfono WhatsApp -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nombre Comercial de la Agencia</label>
      <input
        type="text"
        pInputText
        formControlName="agenciaNombre"
        placeholder="Ej. Valeria Studio & Co. Wedding Planners"
        class="w-full p-inputtext-sm"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">WhatsApp de Contacto / Coordinación</label>
      <input
        type="text"
        pInputText
        formControlName="agenciaTelefono"
        placeholder="Ej. 5512345678"
        class="w-full p-inputtext-sm"
      />
    </div>
  </div>

  <!-- URL del Logo & Notas -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">URL del Logo de la Agencia (opcional)</label>
      <input
        type="text"
        pInputText
        formControlName="agenciaLogoUrl"
        placeholder="https://..."
        class="w-full p-inputtext-sm"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Slogan / Mensaje Corto</label>
      <input
        type="text"
        pInputText
        formControlName="agenciaNotas"
        placeholder="Ej. Diseño & Coordinación de Eventos de Lujo"
        class="w-full p-inputtext-sm"
      />
    </div>
  </div>

  <!-- Botones de Acción -->
  <div class="flex justify-end items-center gap-2 pt-4 border-t border-slate-100">
    <p-button
      type="button"
      label="Cancelar"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancelar()">
    </p-button>
    <p-button
      type="submit"
      label="Guardar Marca Blanca"
      [icon]="guardando ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
      severity="primary"
      [disabled]="guardando">
    </p-button>
  </div>
</form>
