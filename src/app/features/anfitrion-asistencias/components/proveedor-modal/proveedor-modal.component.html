<form [formGroup]="form" (ngSubmit)="guardar()" class="grid grid-cols-12 gap-x-5 gap-y-7 pt-6">

  <!-- FILA 1: NOMBRE COMERCIAL (6 COLS) Y CATEGORÍA (6 COLS) -->
  <div class="col-span-12 sm:col-span-6 flex flex-col gap-1">
    <p-floatLabel class="w-full block">
      <input
        pInputText
        id="empresa"
        type="text"
        formControlName="empresa"
        class="w-full"
        autocomplete="off" />
      <label for="empresa">Nombre Comercial / Empresa *</label>
    </p-floatLabel>
    @if (form.get('empresa')?.touched && form.get('empresa')?.invalid) {
      <span class="text-xs text-rose-500 font-semibold pl-1">El nombre de la empresa es requerido.</span>
    }
  </div>

  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <p-dropdown
        id="categoria"
        inputId="categoria"
        [options]="categorias"
        formControlName="categoria"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        placeholder="Seleccionar Categoría">
      </p-dropdown>
      <label for="categoria">Categoría del Proveedor *</label>
    </p-floatLabel>
  </div>

  <!-- FILA 2: NOMBRE DE CONTACTO (6 COLS) Y TELÉFONO / WHATSAPP (6 COLS) -->
  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <input
        pInputText
        id="contactoNombre"
        type="text"
        formControlName="contactoNombre"
        class="w-full"
        autocomplete="off" />
      <label for="contactoNombre">Nombre de Contacto</label>
    </p-floatLabel>
  </div>

  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <input
        pInputText
        id="telefono"
        type="text"
        formControlName="telefono"
        class="w-full"
        autocomplete="off" />
      <label for="telefono">Teléfono / WhatsApp</label>
    </p-floatLabel>
  </div>

  <!-- FILA 3: CORREO ELECTRÓNICO (6 COLS) Y MONTO DEL CONTRATO (6 COLS) -->
  <div class="col-span-12 sm:col-span-6 flex flex-col gap-1">
    <p-floatLabel class="w-full block">
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        class="w-full"
        autocomplete="off" />
      <label for="email">Correo Electrónico</label>
    </p-floatLabel>
    @if (form.get('email')?.touched && form.get('email')?.invalid) {
      <span class="text-xs text-rose-500 font-semibold pl-1">Ingresa un correo electrónico válido.</span>
    }
  </div>

  <div class="col-span-12 sm:col-span-6">
    <p-floatLabel class="w-full block">
      <p-inputNumber
        id="montoContrato"
        inputId="montoContrato"
        formControlName="montoContrato"
        mode="currency"
        currency="MXN"
        locale="es-MX"
        styleClass="w-full"
        inputStyleClass="w-full font-semibold text-slate-800"
        [min]="0">
      </p-inputNumber>
      <label for="montoContrato">Monto Total del Contrato ($)</label>
    </p-floatLabel>
  </div>

  <!-- FILA 4: NOTAS DEL CONTRATO (12 COLS) -->
  <div class="col-span-12">
    <p-floatLabel class="w-full block">
      <input
        pInputText
        id="notas"
        type="text"
        formControlName="notas"
        class="w-full"
        autocomplete="off" />
      <label for="notas">Notas del Contrato / Requerimientos</label>
    </p-floatLabel>
  </div>

  <!-- BOTONES DE ACCIÓN -->
  <div class="col-span-12 flex justify-end gap-3 pt-3 mt-2 border-t border-slate-100">
    <p-button
      type="button"
      label="Cancelar"
      severity="danger"
      [text]="true"
      size="small"
      (onClick)="cancelar()">
    </p-button>

    <p-button
      type="submit"
      [label]="esEdicion ? 'Actualizar Proveedor' : 'Guardar Proveedor'"
      [icon]="esEdicion ? 'pi pi-check' : 'pi pi-plus'"
      size="small">
    </p-button>
  </div>
</form>
