<div class="dashboard-container">

  <!-- HEADER PRINCIPAL -->
  <div class="dashboard-header">
    <div class="title-group">
      <h1 class="dashboard-title">Tus Eventos</h1>
      <p class="dashboard-subtitle">Gestiona y administra todas tus invitaciones digitales</p>
    </div>
    <p-button label="Nuevo Evento" icon="pi pi-plus" (onClick)="openDialog()" [rounded]="true"></p-button>
  </div>

  <!-- TARJETA CONTENEDORA DE LA TABLA -->
  <div class="table-card">
    <p-table
      #dt
      [value]="eventos"
      [paginator]="true"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 20]"
      [globalFilterFields]="['titulo', 'fecha', 'enlace']"
      styleClass="p-datatable-borderless modern-table"
    >
      <!-- TOOLBAR DE LA TABLA (Solo el buscador, alineado a la derecha) -->
      <ng-template pTemplate="caption">
        <div class="table-toolbar">
          <span class="p-input-icon-left search-wrapper">
            <i class="pi pi-search"></i>
            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar por nombre, URL o fecha..." />
          </span>
        </div>
      </ng-template>

      <!-- CABECERAS MINIMALISTAS -->
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="titulo">Evento <p-sortIcon field="titulo"></p-sortIcon></th>
          <th pSortableColumn="fecha">Fecha <p-sortIcon field="fecha"></p-sortIcon></th>
          <th pSortableColumn="enlace">Enlace</th>
          <th>Estado</th>
          <th style="text-align: right;">Acciones</th>
        </tr>
      </ng-template>

      <!-- CUERPO DE LA TABLA -->
      <ng-template pTemplate="body" let-evento>
        <tr>
          <td class="fw-medium">{{ evento.titulo }}</td>
          <td class="text-secondary">{{ evento.fecha }}</td>
          <td class="text-secondary">
            <span class="url-badge">/e/{{ evento.enlace }}</span>
          </td>
          <td>
            <p-tag [value]="evento.estaActivo ? 'Activo' : 'Borrador'"
                   [severity]="evento.estaActivo ? 'success' : 'warning'"
                   [rounded]="true">
            </p-tag>
          </td>
          <td style="text-align: right;">

            <div class="action-buttons">

              <!-- BOTÓN QR PARA MESAS (Solo si tiene Álbum contratado) -->
              <p-button
                *ngIf="!evento.modulos || evento.modulos.tieneAlbum"
                icon="pi pi-qrcode"
                [rounded]="true"
                [text]="true"
                severity="warning"
                pTooltip="Código QR para Mesas (Álbum)"
                tooltipPosition="top"
                (onClick)="abrirQrMesas(evento)">
              </p-button>


              <p-button
                icon="pi pi-users"
                [rounded]="true"
                [text]="true"
                severity="info"
                pTooltip="Ver Asistencias / Invitados"
                tooltipPosition="top"
                (onClick)="verAsistencias(evento)">
              </p-button>
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" (onClick)="openDialog(evento)"></p-button>
              <p-button
                [icon]="evento.estaActivo ? 'pi pi-power-off' : 'pi pi-check-circle'"
                [rounded]="true"
                [text]="true"
                [severity]="evento.estaActivo ? 'danger' : 'success'"
                (onClick)="toggleEstado(evento)">
              </p-button>            </div>
          </td>
        </tr>
      </ng-template>

      <!-- ESTADO VACÍO ELEGANTE -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty-state">
            <i class="pi pi-folder-open empty-icon"></i>
            <p>No tienes eventos registrados aún.<br>Haz clic en "Nuevo Evento" para empezar.</p>
          </td>
        </tr>
