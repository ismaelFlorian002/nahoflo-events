<div class="login-wrapper">
  <!-- Tarjeta de PrimeNG -->
  <p-card header="NahoFlo Studio" subheader="Acceso Restringido" styleClass="login-card">
    <div class="form-container">

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" pInputText [(ngModel)]="email" placeholder="admin@nahoflo.com" autocomplete="off" />
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" pInputText [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="onLogin()" />
      </div>

      <!-- Mensaje de error dinámico -->
      <small class="error-text" *ngIf="errorMessage">{{ errorMessage }}</small>

      <!-- Botón nativo de PrimeNG -->
      <p-button
        label="Ingresar al Panel"
        icon="pi pi-lock"
        [loading]="loading"
        (onClick)="onLogin()">
      </p-button>

    </div>
  </p-card>
</div>
