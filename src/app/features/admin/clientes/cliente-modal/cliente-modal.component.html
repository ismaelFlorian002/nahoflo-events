<form [formGroup]="clienteForm" (ngSubmit)="guardarCliente()" class="grid grid-cols-12 gap-x-5 gap-y-8 pt-7 pb-2">
<!--  class="grid grid-cols-12 gap-5 pt-4"-->
  <!-- Nombre Completo (Fila completa - 12 columnas) -->
  <div class="col-span-12">
    <p-floatlabel variant="on" class="w-full block">
      <input
        id="modalNombre"
        pInputText
        formControlName="nombreCompleto"
        class="w-full"
        autocomplete="off"
      />
      <label for="modalNombre">Nombre Completo *</label>
    </p-floatlabel>
  </div>

  <!-- Teléfono / WhatsApp (Media fila en desktop - 6 columnas) -->
  <div class="col-span-12 sm:col-span-6">
    <p-floatlabel variant="on" class="w-full block">
      <input
        id="modalTelefono"
        pInputText
        formControlName="telefono"
        class="w-full"
        autocomplete="off"
        placeholder="Ej. 6671234567"
      />
      <label for="modalTelefono">Teléfono / WhatsApp *</label>
    </p-floatlabel>
  </div>

  <!-- Correo Electrónico (Media fila en desktop - 6 columnas) -->
  <div class="col-span-12 sm:col-span-6">
    <p-floatlabel variant="on" class="w-full block">
      <input
        id="modalEmail"
        pInputText
        formControlName="email"
        type="email"
        class="w-full"
        autocomplete="off"
        placeholder="correo@ejemplo.com"
      />
      <label for="modalEmail">Correo Electrónico (Opcional)</label>
    </p-floatlabel>
  </div>

  <!-- Notas internas (Fila completa - 12 columnas) -->
  <div class="col-span-12">
    <p-floatlabel variant="on" class="w-full block">
      <textarea
        id="modalNotas"
        pTextarea
        formControlName="notas"
        rows="3"
        class="w-full resize-none"
      ></textarea>
      <label for="modalNotas">Notas o preferencias de atención</label>
    </p-floatlabel>
  </div>

  <!-- Acciones del Modal (Alineadas al final) -->
  <div class="col-span-12 flex justify-end gap-3 pt-3 mt-2 border-t border-slate-100">
    <button pButton type="button"
     
      severity="danger"
      [text]="true"
      size="small"
      (click)="cancelar()"
    >
  <span>Cancelar</span>
</button>
    <button pButton type="submit"
     
      [loading]="guardando"
      size="small"
    >
  <span>{{ clienteEnEdicion ? 'Actualizar Cliente' : 'Guardar Cliente' }}</span>
 </button>
  </div>

</form>
