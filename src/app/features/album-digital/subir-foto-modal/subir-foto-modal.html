<form [formGroup]="formRecuerdo" (ngSubmit)="publicarCarrusel()" class="modal-form">

  <!-- ZONA DE SELECCIÓN / TIRA DE PREVIEW DEL CARRUSEL -->
  <div class="zona-carrusel-subida">
    @if (previewsUrls().length === 0) {
      <!-- BOTÓN PRINCIPAL DE SELECCIÓN -->
      <label class="caja-subida" for="inputFotosMultiple">
        <i class="pi pi-images icono-camara"></i>
        <span class="texto-principal">Seleccionar Fotos para el Carrusel</span>
        <span class="texto-secundario">Puedes elegir varias fotos de tu galería</span>
      </label>
    } @else {
      <!-- TIRA DE FOTOS SELECCIONADAS -->
      <div class="panel-previews">
        <div class="cabecera-previews">
          <span class="conteo-carrusel">
            <i class="pi pi-clone"></i>
            {{ previewsUrls().length }} {{ previewsUrls().length === 1 ? 'foto' : 'fotos' }} en el carrusel
          </span>

          <label for="inputFotosMultiple" class="btn-agregar-mas">
            <i class="pi pi-plus"></i>
            <span>Añadir más</span>
          </label>
        </div>

        <div class="tira-horizontal-fotos">
          @for (url of previewsUrls(); track $index) {
            <div class="item-preview">
              <img [src]="url" alt="Foto seleccionada" />
              <button
                type="button"
                class="btn-quitar-foto"
                (click)="removerFoto($index)"
                title="Quitar foto">
                <i class="pi pi-times"></i>
              </button>
              <span class="badge-posicion">{{ $index + 1 }}</span>
            </div>
          }
        </div>
      </div>
    }

    <!-- INPUT OCULTO QUE PERMITE MULTIPLE -->
    <input
      id="inputFotosMultiple"
      type="file"
      multiple
      accept="image/*"
      (change)="onFotosSeleccionadas($event)"
      style="display: none;"
    />
  </div>

  @if (errorSubida()) {
    <div class="alerta-error">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ errorSubida() }}</span>
    </div>
  }

  <!-- CAMPOS UNIFORMES -->
  <div class="campos-contenedor">
    <span class="p-float-label">
      <input id="nombreAutor" pInputText formControlName="nombreAutor" style="width: 100%" autocomplete="off" />
      <label for="nombreAutor">Tu Nombre *</label>
    </span>

    <span class="p-float-label">
      <textarea id="mensaje" pInputTextarea formControlName="mensaje" rows="2" style="width: 100%; resize: none;"></textarea>
      <label for="mensaje">Dedicatoria para los novios (opcional)</label>
    </span>
  </div>

  <!-- BOTONES DE ACCIÓN -->
  <div class="acciones-modal">
    <p-button
      type="button"
      label="Cancelar"
      severity="secondary"
      [text]="true"
      (onClick)="ref.close(false)">
    </p-button>

    <p-button
      type="submit"
      [label]="previewsUrls().length > 1 ? 'Publicar Carrusel (' + previewsUrls().length + ')' : 'Publicar Foto'"
      icon="pi pi-send"
      [loading]="subiendo()"
      [disabled]="formRecuerdo.invalid || archivosFotos().length === 0 || subiendo()">
    </p-button>
  </div>

</form>
