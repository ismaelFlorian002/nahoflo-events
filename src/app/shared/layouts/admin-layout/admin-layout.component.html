<div class="min-h-screen flex text-gray-800 bg-gray-50">

  <!-- MENÚ LATERAL (SIDEBAR PREMIUM) -->
  <aside class="w-64 bg-white shadow-[4px_0_24px_rgba(0,0,0,0.02)] border-r border-gray-100 flex flex-col justify-between shrink-0 sticky top-0 h-screen z-20">
    <div>
      <!-- Cabecera del Sidebar: Logo y Marca -->
      <div class="p-6 flex items-center gap-3 border-b border-gray-100/80">
        <img src="logo.png" alt="NahoFlo Events" class="h-9 w-auto object-contain" />
        <div class="flex flex-col">
          <span class="text-sm font-bold text-gray-900 leading-tight">NahoFlo Creative Studio</span>
          <span class="text-[11px] font-medium text-gold-500 uppercase tracking-wider">Eventos</span>
        </div>
      </div>

      <!-- Navegación Principal -->
      <div class="px-4 py-6">
        <span class="block px-3 text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">
          Panel de Control
        </span>
        <nav class="flex flex-col gap-1.5" aria-label="Navegación del Administrador">

          <!-- Enlace: Eventos -->
          <a
            routerLink="/admin"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="bg-gold-50 text-gold-600 font-semibold"
            [class.text-gray-500]="true"
            class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition-colors duration-200 hover:bg-pastel-pink-50 hover:text-pastel-pink-500 no-underline cursor-pointer">
            <i class="pi pi-calendar text-base"></i>
            <span>Eventos</span>
          </a>

          <!-- Enlace: Clientes -->
          <a
            routerLink="/admin/clientes"
            routerLinkActive="bg-gold-50 text-gold-600 font-semibold"
            [class.text-gray-500]="true"
            class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition-colors duration-200 hover:bg-pastel-pink-50 hover:text-pastel-pink-500 no-underline cursor-pointer">
            <i class="pi pi-users text-base"></i>
            <span>Clientes</span>
          </a>

        </nav>
      </div>
    </div>

    <!-- Sección Inferior: Cerrar Sesión -->
    <div class="p-4 border-t border-gray-100/80">
      <span class="block px-3 text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">
        Sistema
      </span>
      <button
        type="button"
        (click)="logout()"
        class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-gray-500 hover:bg-red-50 hover:text-red-500 transition-colors duration-200 border-0 bg-transparent cursor-pointer">
        <i class="pi pi-power-off text-base"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- ÁREA DE CONTENIDO (MAIN) -->
  <main class="flex-1 min-w-0 p-8 w-full flex flex-col">
    <!-- Contenido Inyectado por Router Outlet -->
    <div class="flex-1 w-full">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
